receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  # Traces: one span tree per executionId, so the retry/breaker structure of a
  # single call is visible rather than inferred.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Metrics: exposed for Prometheus to scrape. resource_to_telemetry_conversion
  # turns resource attributes (service.name, replica) into labels, which is how
  # a panel can tell one replica from another.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
