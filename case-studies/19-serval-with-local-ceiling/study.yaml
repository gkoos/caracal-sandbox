# The delegated topology with a local ceiling composed innermost.
#
# The delegated layers are approximate by design: they admit from authority a
# replica holds, and that authority can be stale. A local policy is the only bound
# that holds when the coordinator does not answer, so this study pairs the two -
# the fleet target for economy, the local ceiling for the worst case.
#
# Claim: the ceiling costs nothing while the authority is answering (the healthy
# run below is indistinguishable from 18), and it is what bounds the run when the
# authority is not. The bounded version of the outage is study 20.
#
#   npm run demo 19
#   npm run compare 18 19     # what the bound costs when nothing is wrong
id: "19-serval-with-local-ceiling"
title: "Delegated, bounded from inside the process"
question: "Does a per-process ceiling cost anything when the coordinator is healthy?"

topology:
  policies: serval
  scope: global
  replicas: 4
  env:
    REDIS_URL: "redis://127.0.0.1:6379"
    BULKHEAD_LIMIT: "5"          # the fleet target, unchanged from 18
    LOCAL_CEILING: "2"           # the per-process bound: 4 x 2 = 8 is the worst case
    POLICY_TIMEOUT_MS: "2000"
    RETRY_MAX_ATTEMPTS: "2"
    SERVAL_FRESHNESS_MS: "1000"
    SERVAL_VALIDITY_MS: "5000"
    SERVAL_GRACE_MS: "5000"

scenario:
  durationMs: 15000
  concurrency: 20
  targetRps: 400
  seed: 1
  operations:
    - { name: "orders.get", method: GET, path: "/orders/{id}", weight: 1 }
  dependency:
    latencyMs: 30
    failureRate: 0
    capacity: 8

checks:
  - { name: witnessPresent }
  - { name: witnessSamplesAtLeast, params: { value: 200 } }
  # The bound is deliberately tighter than the fleet target here - 2 per process
  # across 4 processes is 8, against a fleet target of 5 - so it *does* bind when
  # the load concentrates on one replica, and the admitted share drops. That is the
  # point of the study: the ceiling is the worst case the fleet can reach, and what
  # it costs is what `compare 18 19` measures. Two runs of the same configuration
  # have already differed by ten points of admitted share (25.4% and 15.3%), which
  # is the sensitivity this pairing exists to expose.
  - { name: peakInFlightAtMost, params: { value: 8 } }
  - { name: successRateAtLeast, params: { value: 0.1 } }
  - { name: breakerOpensEquals, params: { value: 0 } }
  - { name: coordinatorRoundTripsAtMost, params: { value: 3 } }
