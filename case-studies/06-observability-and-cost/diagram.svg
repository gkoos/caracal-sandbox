<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>caracal demo — topology</title>
<rect width="780" height="360" fill="#fcfcfc"/>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a5d61"/></marker></defs>
<rect x="20" y="112" width="150" height="52" rx="9" fill="#c77748"/><text x="95" y="135" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">operation</text><text x="95" y="151" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">events: {status} only</text>
<rect x="215" y="112" width="130" height="52" rx="9" fill="#5a5d61"/><text x="280" y="135" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">event sink</text><text x="280" y="151" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">fire-and-forget</text>
<line x1="170" y1="138" x2="213" y2="138" stroke="#5a5d61" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<rect x="390" y="112" width="110" height="52" rx="9" fill="#33546b"/><text x="445" y="135" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">OTel SDK</text><text x="445" y="151" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">buffered</text>
<line x1="345" y1="138" x2="388" y2="138" stroke="#5a5d61" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<rect x="545" y="40" width="190" height="44" rx="9" fill="#a03d3d"/><text x="640" y="59" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Prometheus</text><text x="640" y="75" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">caracal_executions_total</text>
<rect x="545" y="140" width="190" height="44" rx="9" fill="#3e6f8e"/><text x="640" y="159" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Jaeger</text><text x="640" y="175" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">one trace per execution</text>
<line x1="500" y1="130" x2="543" y2="62" stroke="#5a5d61" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<line x1="500" y1="146" x2="543" y2="162" stroke="#5a5d61" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<text x="390" y="345" text-anchor="middle" fill="#5a5d61" font-size="10.5" font-style="italic" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">a throwing or slow-async sink is free; only a synchronously blocking one can hurt p99</text>
