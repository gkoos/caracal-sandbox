<rect x="30" y="60" width="150" height="56" rx="9" fill="#c77748"/><text x="105" y="85" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">partner-api</text><text x="105" y="101" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">bulkhead · limit 1</text>
<rect x="30" y="180" width="150" height="44" rx="9" fill="#a03d3d"/><text x="105" y="199" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">valkey</text><text x="105" y="215" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">distributed permit</text>
<line x1="105" y1="180" x2="105" y2="118" stroke="#5a5d61" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<rect x="560" y="60" width="190" height="56" rx="9" fill="#33546b"/><text x="655" y="85" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">PostgreSQL</text><text x="655" y="101" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">SELECT pg_sleep(2)</text>
<line x1="180" y1="88" x2="558" y2="88" stroke="#5a5d61" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="369" y="82" text-anchor="middle" fill="#5a5d61" font-size="10.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">timeout 500ms · query 2s</text>
<rect x="250" y="20" width="137.60000000000002" height="18" rx="9" fill="#d9ece5"/><text x="318.8" y="33" text-anchor="middle" fill="#171d26" font-size="10.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">permit held ~2000ms</text>
<text x="390" y="345" text-anchor="middle" fill="#5a5d61" font-size="10.5" font-style="italic" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">abort: unsupported — the caller times out at 500ms, the permit is held until the query ends</text>
